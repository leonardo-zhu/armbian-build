name: Build Armbian for NanoPi R4S

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Debian/Ubuntu Release'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - bookworm
          - noble
      branch:
        description: 'Kernel Branch'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - edge
          - legacy

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential ca-certificates pigz jq qemu-user-static binfmt-support

      - name: Pass Secrets to Armbian Sandbox
        env:
          SECRET_USER: ${{ secrets.PPPOE_USER }}
          SECRET_PASS: ${{ secrets.PPPOE_PASS }}
        run: |
          # Armbian 的 chroot 沙盒会把主机的 userpatches 目录挂载到沙盒内的 /tmp/overlay
          # 因此我们直接写入 userpatches/secrets.sh，脚本里就能通过 /tmp/overlay/secrets.sh 读到了
          cat <<EOF > userpatches/secrets.sh
          export PPPOE_USER='${SECRET_USER}'
          export PPPOE_PASS='${SECRET_PASS}'
          EOF
          
      - name: Compile Armbian Image
        run: |
          ./compile.sh build \
            BOARD=nanopi-r4s \
            BRANCH=${{ github.event.inputs.branch }} \
            RELEASE=${{ github.event.inputs.release }} \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz

      - name: Compress & Upload Armbian Image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian_nanopi-r4s_${{ github.event.inputs.release }}_${{ github.event.inputs.branch }}
          path: |
            output/images/*.img
            output/images/*.img.xz
            output/images/*.sha
          retention-days: 7
