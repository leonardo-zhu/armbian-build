name: Build Armbian for NanoPi R4S

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Debian/Ubuntu Release'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - bookworm
          - noble
      branch:
        description: 'Kernel Branch'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - edge
          - legacy

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential ca-certificates pigz jq qemu-user-static binfmt-support

      - name: Pass Secrets to Armbian Sandbox
        env:
          SECRET_USER: ${{ secrets.PPPOE_USER }}
          SECRET_PASS: ${{ secrets.PPPOE_PASS }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SECRET_USER}" || -z "${SECRET_PASS}" ]]; then
            echo "PPPOE_USER and PPPOE_PASS GitHub Actions secrets are required." >&2
            exit 1
          fi

          # Armbian binds host userpatches/overlay to /tmp/overlay inside the image chroot.
          install -d -m 700 userpatches/overlay
          {
            printf 'export PPPOE_USER=%q\n' "${SECRET_USER}"
            printf 'export PPPOE_PASS=%q\n' "${SECRET_PASS}"
          } > userpatches/overlay/secrets.sh
          chmod 600 userpatches/overlay/secrets.sh
          
      - name: Compile Armbian Image
        run: |
          ./compile.sh build \
            BOARD=nanopi-r4s \
            BRANCH=${{ github.event.inputs.branch }} \
            RELEASE=${{ github.event.inputs.release }} \
            VENDOR=Armbian \
            ROOTPWD='15956404411Zxl' \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz

      - name: Compress & Upload Armbian Image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian_nanopi-r4s_${{ github.event.inputs.release }}_${{ github.event.inputs.branch }}
          path: |
            output/images/*.img
            output/images/*.img.xz
            output/images/*.sha
          retention-days: 7
